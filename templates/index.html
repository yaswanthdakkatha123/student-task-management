<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.json') }}">
    <style>

#splashScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed,
        #ec4899
    );

    transition: opacity 0.5s ease;
}

.splash-content {
    text-align: center;
    color: white;
}

.splash-icon {
    width: 150px;
    height: 150px;

    border-radius: 30px;

    object-fit: cover;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.3);

    margin-bottom: 20px;
}

.splash-content h1 {
    font-size: 28px;
    margin: 10px 0;
}

.splash-content p {
    font-size: 16px;
    opacity: 0.9;
}

.splash-loader {
    width: 35px;
    height: 35px;

    margin: 25px auto 0;

    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: white;

    border-radius: 50%;

    animation: splashSpin 1s linear infinite;
}

@keyframes splashSpin {
    to {
        transform: rotate(360deg);
    }
}

</style>
</head>

<body>
    <!-- CUSTOM SPLASH SCREEN -->

<div id="splashScreen">

    <div class="splash-content">

        <img
            src="/static/icon.png"
            alt="Student Task Manager"
            class="splash-icon"
        >

        <h1>Student Task Manager</h1>

        <p>Manage your tasks easily</p>

        <div class="splash-loader"></div>

    </div>

</div>

    <div class="container">

        <div class="navbar">

            <div class="nav-title">
                📚 Student Task Manager
            </div>

            <div class="nav-buttons">
                <a href="/login" class="nav-btn">🔐 Login</a>
                <a href="/register" class="nav-btn">📝 Register</a>
                <a href="/logout" class="nav-btn logout-btn">🚪 Logout</a>
            </div>

        </div>

        <h1>Student Task Management</h1>

        <p>Manage your tasks easily</p>

        <div class="stats">

            <div class="stat-box">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-box">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

        </div>

        <div class="task-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <input
                type="date"
                id="dueDate"
            >

            <input
                type="time"
                id="dueTime"
            >

            <button onclick="addTask()">Add Task</button>

        </div>

        <ul id="taskList"></ul>

    </div>


    <!-- MAIN JAVASCRIPT -->

    <script>

    async function addTask() {

        const taskInput =
            document.getElementById("taskInput");

        const dueDateInput =
            document.getElementById("dueDate");

        const dueTimeInput =
            document.getElementById("dueTime");

        const task =
            taskInput.value.trim();

        const dueDate =
            dueDateInput.value;

        const dueTime =
            dueTimeInput.value;


        if (task === "") {
            alert("Please enter a task");
            return;
        }


        if (dueDate === "") {
            alert("Please select a due date");
            return;
        }


        if (dueTime === "") {
            alert("Please select a due time");
            return;
        }


        try {

            const response = await fetch("/add_task", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    task: task,
                    due_date: dueDate,
                    due_time: dueTime
                })

            });


            if (response.ok) {

                alert("Task added successfully!");

                taskInput.value = "";
                dueDateInput.value = "";
                dueTimeInput.value = "";

                loadTasks();

            } else {

                const data =
                    await response.json();

                alert(
                    data.error ||
                    "Failed to add task"
                );

            }

        } catch (error) {

            console.error(
                "Add task error:",
                error
            );

            alert("Something went wrong while adding the task.");

        }

    }


    async function loadTasks() {

        try {

            const response =
                await fetch("/tasks");

            if (!response.ok) {
                return;
            }

            const tasks =
                await response.json();

            const taskList =
                document.getElementById("taskList");

            taskList.innerHTML = "";


            const totalTasks =
                document.getElementById("totalTasks");

            const completedTasks =
                document.getElementById("completedTasks");

            const pendingTasks =
                document.getElementById("pendingTasks");


            const completedCount =
                tasks.filter(
                    task => task.completed === 1
                ).length;


            const pendingCount =
                tasks.length -
                completedCount;


            totalTasks.textContent =
                tasks.length;

            completedTasks.textContent =
                completedCount;

            pendingTasks.textContent =
                pendingCount;


            tasks.forEach(function(task) {

                const li =
                    document.createElement("li");


                const taskText =
                    document.createElement("span");

                taskText.textContent =
                    task.task;


                const dueDateText =
                    document.createElement("span");

                dueDateText.textContent =
                    ` 📅 Due: ${task.due_date} ⏰ ${task.due_time || ""}`;

                dueDateText.style.marginLeft =
                    "10px";


                if (task.completed === 1) {

                    taskText.style.textDecoration =
                        "line-through";

                }


                li.appendChild(taskText);

                li.appendChild(dueDateText);


                // EDIT BUTTON

                const editButton =
                    document.createElement("button");

                editButton.textContent =
                    "Edit";


                editButton.onclick =
                    async function() {

                    const newTask =
                        prompt(
                            "Enter the updated task:",
                            task.task
                        );


                    if (
                        newTask === null ||
                        newTask.trim() === ""
                    ) {
                        return;
                    }


                    const newDueDate =
                        prompt(
                            "Enter the updated due date (YYYY-MM-DD):",
                            task.due_date || ""
                        );


                    if (
                        newDueDate === null ||
                        newDueDate.trim() === ""
                    ) {
                        return;
                    }


                    const newDueTime =
                        prompt(
                            "Enter the updated due time (HH:MM):",
                            task.due_time || ""
                        );


                    if (
                        newDueTime === null ||
                        newDueTime.trim() === ""
                    ) {
                        return;
                    }


                    const response =
                        await fetch(
                            `/edit_task/${task.id}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    task:
                                        newTask.trim(),

                                    due_date:
                                        newDueDate.trim(),

                                    due_time:
                                        newDueTime.trim()

                                })
                            }
                        );


                    if (response.ok) {

                        alert(
                            "Task updated successfully!"
                        );

                        loadTasks();

                    } else {

                        const data =
                            await response.json();

                        alert(
                            data.error ||
                            "Failed to update task"
                        );

                    }

                };


                // COMPLETE BUTTON

                const completeButton =
                    document.createElement("button");

                completeButton.textContent =
                    "Complete";


                completeButton.onclick =
                    async function() {

                    const response =
                        await fetch(
                            `/complete_task/${task.id}`,
                            {
                                method: "PUT"
                            }
                        );

                    if (response.ok) {
                        loadTasks();
                    }

                };


                // DELETE BUTTON

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent =
                    "Delete";


                deleteButton.onclick =
                    async function() {

                    const response =
                        await fetch(
                            `/delete_task/${task.id}`,
                            {
                                method: "DELETE"
                            }
                        );

                    if (response.ok) {
                        loadTasks();
                    }

                };


                li.appendChild(editButton);

                li.appendChild(completeButton);

                li.appendChild(deleteButton);

                taskList.appendChild(li);

            });

        } catch (error) {

            console.error(
                "Load tasks error:",
                error
            );

        }

    }


    // ==============================
    // DUE TIME NOTIFICATION
    // ==============================

    async function checkDueTasks() {

        try {

            const response =
                await fetch("/tasks");

            if (!response.ok) {
                return;
            }

            const tasks =
                await response.json();

            const now =
                new Date();


            tasks.forEach(function(task) {

                if (task.completed === 1) {
                    return;
                }


                if (!task.due_date || !task.due_time) {
                    return;
                }


                const dueDateTime =
                    new Date(
                        task.due_date +
                        "T" +
                        task.due_time
                    );


                const difference =
                    Math.abs(
                        now.getTime() -
                        dueDateTime.getTime()
                    );


                // Due time within 30 seconds

                if (difference <= 30000) {

                    const notificationKey =
                        "notified_task_" +
                        task.id;


                    if (
                        localStorage.getItem(
                            notificationKey
                        )
                    ) {
                        return;
                    }


                    localStorage.setItem(
                        notificationKey,
                        "true"
                    );


                    if (
                        "serviceWorker" in navigator &&
                        Notification.permission === "granted"
                    ) {

                        navigator.serviceWorker.ready.then(
                            function(registration) {

                                registration.showNotification(
                                    "⏰ Task Due!",
                                    {
                                        body:
                                            task.task +
                                            " is due now.",

                                        icon:
                                            "/static/icon.png",

                                        badge:
                                            "/static/icon.png"
                                    }
                                );

                            }
                        );

                    }

                }

            });

        } catch (error) {

            console.error(
                "Due time check failed:",
                error
            );

        }

    }


    // Load tasks when page opens

    loadTasks();


    // Check due tasks every 30 seconds

    setInterval(
        checkDueTasks,
        30000
    );

    </script>


    <!-- SERVICE WORKER -->

    <script>

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function() {

                navigator.serviceWorker
                    .register("/service-worker.js")

                    .then(
                        function(registration) {

                            console.log(
                                "Service Worker registered:",
                                registration.scope
                            );

                        }
                    )

                    .catch(
                        function(error) {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        }
                    );

            }
        );

    }

    </script>


    <!-- NOTIFICATION PERMISSION -->

    <script>

    if ("Notification" in window) {

        if (
            Notification.permission === "default"
        ) {

            Notification.requestPermission()
                .then(
                    function(permission) {

                        console.log(
                            "Notification permission:",
                            permission
                        );

                    }
                );

        }

    }

    </script>
    <script>

window.addEventListener("load", function() {

    setTimeout(function() {

        const splash =
            document.getElementById("splashScreen");

        splash.style.opacity = "0";

        setTimeout(function() {
            splash.style.display = "none";
        }, 500);

    }, 1500);

});

</script>

</body>

</html>
